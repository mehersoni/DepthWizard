<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DepthWizard — M5 3D Viewer (MVP)</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0b0e14; font-family:'Segoe UI', Arial, sans-serif; }
  #canvas-holder { position:absolute; inset:0; }
  #hud {
    position:absolute; top:12px; left:12px; z-index:10;
    background:rgba(15,18,26,0.85); color:#e6e9ef; padding:14px 16px;
    border-radius:10px; font-size:13px; line-height:1.5; width:270px;
    border:1px solid rgba(255,255,255,0.08); backdrop-filter: blur(6px);
  }
  #hud h1 { font-size:14px; margin:0 0 8px 0; color:#7cc4ff; }
  #hud label { display:block; margin-top:10px; font-size:12px; color:#9aa4b2; }
  #hud input[type="range"] { width:100%; }
  #hud button, #hud input[type="file"]::file-selector-button {
    background:#1f2a3a; color:#e6e9ef; border:1px solid #33465e; border-radius:6px;
    padding:6px 10px; font-size:12px; cursor:pointer; margin-top:6px;
  }
  #hud button:hover { background:#2a3a50; }
  #hud .row { display:flex; gap:6px; }
  #hud .row button { flex:1; }
  #info {
    position:absolute; bottom:12px; left:12px; z-index:10;
    background:rgba(15,18,26,0.85); color:#e6e9ef; padding:10px 14px;
    border-radius:10px; font-size:12.5px; min-width:220px;
    border:1px solid rgba(255,255,255,0.08);
  }
  #info .val { color:#7cc4ff; font-weight:600; }
  #mode-badge {
    position:absolute; top:12px; right:12px; z-index:10;
    background:rgba(15,18,26,0.85); color:#ffd27c; padding:6px 12px;
    border-radius:20px; font-size:12px; border:1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<div id="canvas-holder"></div>

<div id="hud">
  <h1>M5 · 3D Viewer (dummy data)</h1>

  <label>Terrain source</label>
  <div class="row">
    <button id="btn-bump">Gaussian bump</button>
    <button id="btn-ridge">Ridge/noise</button>
  </div>

  <label>Height exaggeration: <span id="exag-val">1.0</span>x</label>
  <input type="range" id="exag" min="0.1" max="4" step="0.1" value="1" />

  <label>RGB texture (optional upload)</label>
  <input type="file" id="tex-upload" accept="image/*" />

  <label>Overlay</label>
  <div class="row">
    <button id="btn-texture">RGB texture</button>
    <button id="btn-slope">Slope map</button>
  </div>

  <label style="margin-top:12px; color:#6b7686;">
    Swap this for real M2 output via the JSON contract at bottom of chat.
  </label>
</div>

<div id="mode-badge">rDSM · relative units</div>

<div id="info">
  Hover the terrain to inspect<br/>
  Height: <span class="val" id="h-val">–</span><br/>
  Slope: <span class="val" id="s-val">–</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------
const GRID = 128;          // resolution of the mesh (never push full-res DSM to browser)
const WORLD_SIZE = 20;     // plane size in scene units
let exaggeration = 1.0;

// ---------------------------------------------------------------
// SCENE / CAMERA / RENDERER
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 20, 60);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(14, 12, 14);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas-holder').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0,0,0);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(10, 20, 10);
scene.add(sun);

// Ground grid helper for spatial reference
const grid = new THREE.GridHelper(WORLD_SIZE*1.4, 20, 0x223047, 0x151b26);
grid.position.y = -0.01;
scene.add(grid);

// ---------------------------------------------------------------
// HEIGHT MAP GENERATORS  (replace with real M2 data later)
// ---------------------------------------------------------------
function generateGaussianBump(size) {
  const data = new Float32Array(size*size);
  const cx = size/2, cy = size/2, sigma = size/5;
  for (let y=0; y<size; y++){
    for (let x=0; x<size; x++){
      const dx = x-cx, dy = y-cy;
      const d2 = dx*dx + dy*dy;
      let h = Math.exp(-d2/(2*sigma*sigma));
      h += 0.15*Math.exp(-(((x-size*0.75)**2)+((y-size*0.3)**2))/(2*(sigma*0.5)**2));
      data[y*size+x] = h;
    }
  }
  return data;
}

function generateRidgeNoise(size) {
  // cheap value-noise stand-in (no deps) — good enough for MVP testing
  const data = new Float32Array(size*size);
  function noise(x,y){
    const s = Math.sin(x*12.9898 + y*78.233)*43758.5453;
    return s - Math.floor(s);
  }
  function smooth(x,y){
    const x0=Math.floor(x), y0=Math.floor(y);
    const fx=x-x0, fy=y-y0;
    const v00=noise(x0,y0), v10=noise(x0+1,y0), v01=noise(x0,y0+1), v11=noise(x0+1,y0+1);
    const i1 = v00*(1-fx)+v10*fx, i2 = v01*(1-fx)+v11*fx;
    return i1*(1-fy)+i2*fy;
  }
  for (let y=0; y<size; y++){
    for (let x=0; x<size; x++){
      let h = 0, amp=1, freq=0.05, sum=0;
      for(let o=0;o<4;o++){
        h += smooth(x*freq, y*freq)*amp;
        sum += amp;
        amp *= 0.5; freq *= 2;
      }
      h /= sum;
      // ridge shaping so it reads like terrain, not blob noise
      h = 1 - Math.abs(h*2-1);
      data[y*size+x] = Math.pow(h, 1.5);
    }
  }
  return data;
}

// ---------------------------------------------------------------
// MESH BUILD
// ---------------------------------------------------------------
let terrainMesh = null;
let currentHeights = null;
let currentSlopes = null;
let overlayMode = 'texture'; // 'texture' | 'slope'
let uploadedTexture = null;

function computeSlopes(heights, size) {
  const slopes = new Float32Array(size*size);
  for (let y=0; y<size; y++){
    for (let x=0; x<size; x++){
      const i = y*size+x;
      const hL = heights[y*size + Math.max(x-1,0)];
      const hR = heights[y*size + Math.min(x+1,size-1)];
      const hU = heights[Math.max(y-1,0)*size + x];
      const hD = heights[Math.min(y+1,size-1)*size + x];
      const dzdx = (hR-hL)*0.5, dzdy = (hD-hU)*0.5;
      slopes[i] = Math.sqrt(dzdx*dzdx + dzdy*dzdy);
    }
  }
  return slopes;
}

function slopeToColor(s, maxS) {
  const t = Math.min(s/ (maxS||1), 1);
  // green (flat) -> yellow -> red (steep)
  const r = t < 0.5 ? t*2 : 1;
  const g = t < 0.5 ? 1 : 1-(t-0.5)*2;
  const b = 0.15;
  return [r, g, b];
}

function buildTerrain(heightData, size) {
  if (terrainMesh) {
    scene.remove(terrainMesh);
    terrainMesh.geometry.dispose();
    terrainMesh.material.dispose();
  }

  currentHeights = heightData;
  currentSlopes = computeSlopes(heightData, size);
  const maxSlope = Math.max(...currentSlopes);

  const geo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, size-1, size-1);
  geo.rotateX(-Math.PI/2);

  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i=0; i<pos.count; i++){
    const h = heightData[i] * 4 * exaggeration; // scale factor for visual read
    pos.setY(i, h);
    const c = slopeToColor(currentSlopes[i], maxSlope);
    colors[i*3]=c[0]; colors[i*3+1]=c[1]; colors[i*3+2]=c[2];
  }
  pos.needsUpdate = true;
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    vertexColors: overlayMode === 'slope',
    map: overlayMode === 'texture' ? (uploadedTexture || checkerTexture()) : null,
    color: overlayMode === 'texture' ? 0xffffff : 0xffffff,
    roughness: 0.9,
    metalness: 0.0,
    flatShading: false,
  });

  terrainMesh = new THREE.Mesh(geo, material);
  terrainMesh.userData.size = size;
  scene.add(terrainMesh);
}

function checkerTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const n = 16, cell = 256/n;
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    ctx.fillStyle = (x+y)%2===0 ? '#2b3a4d' : '#1a2431';
    ctx.fillRect(x*cell, y*cell, cell, cell);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// initial terrain
buildTerrain(generateGaussianBump(GRID), GRID);

// ---------------------------------------------------------------
// UI HOOKS
// ---------------------------------------------------------------
document.getElementById('btn-bump').onclick = () => buildTerrain(generateGaussianBump(GRID), GRID);
document.getElementById('btn-ridge').onclick = () => buildTerrain(generateRidgeNoise(GRID), GRID);

document.getElementById('exag').oninput = (e) => {
  exaggeration = parseFloat(e.target.value);
  document.getElementById('exag-val').textContent = exaggeration.toFixed(1);
  buildTerrain(currentHeights, GRID);
};

document.getElementById('btn-texture').onclick = () => { overlayMode='texture'; buildTerrain(currentHeights, GRID); };
document.getElementById('btn-slope').onclick   = () => { overlayMode='slope';   buildTerrain(currentHeights, GRID); };

document.getElementById('tex-upload').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    new THREE.TextureLoader().load(ev.target.result, (tex) => {
      uploadedTexture = tex;
      overlayMode = 'texture';
      buildTerrain(currentHeights, GRID);
    });
  };
  reader.readAsDataURL(file);
};

// ---------------------------------------------------------------
// RAYCAST HEIGHT / SLOPE READOUT
// ---------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hVal = document.getElementById('h-val');
const sVal = document.getElementById('s-val');

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  if (!terrainMesh) return;
  const hits = raycaster.intersectObject(terrainMesh);
  if (hits.length > 0) {
    const p = hits[0].point;
    hVal.textContent = (p.y / (4*exaggeration)).toFixed(3) + ' (rel. units)';
    // approximate nearest-vertex slope lookup
    const size = terrainMesh.userData.size;
    const gx = Math.round(((p.x/WORLD_SIZE)+0.5) * (size-1));
    const gz = Math.round(((p.z/WORLD_SIZE)+0.5) * (size-1));
    const idx = Math.max(0, Math.min(size*size-1, gz*size+gx));
    sVal.textContent = currentSlopes[idx].toFixed(3);
  }
});

// ---------------------------------------------------------------
// RESIZE + RENDER LOOP
// ---------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
